<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuchumbo Familiar 2026</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0d3b26;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #145336;
      border: 2px solid #d4af37;
      border-radius: 16px;
      padding: 28px 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.65rem;
      color: #ffd166;
    }
    p.subtitle {
      margin: 0 0 22px;
      font-size: 0.95rem;
      color: #e2f1e8;
      line-height: 1.4;
    }
    label {
      display: block;
      text-align: left;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #ffd166;
      font-weight: 600;
    }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d4af37;
      background: #ffffff;
      color: #111827;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #c1121f;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.92; }
    .resultado {
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      background: #ffffff;
      color: #111827;
      display: none;
    }
    .resultado .nombre-asignado {
      font-size: 1.45rem;
      font-weight: 800;
      color: #c1121f;
      margin-top: 6px;
    }
    .error {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(193, 18, 31, 0.25);
      border: 1px solid #ff758f;
      color: #ffe5ec;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cuchumbo Familiar 2026</h1>
    <p class="subtitle">Selecciona tu nombre y escribe tu PIN secreto para ver a quién te toca regalar.</p>

    <label for="participante">Tu nombre</label>
    <select id="participante">
      <option value="">-- Elige tu nombre --</option>
      <option value="Estefany">Estefany</option>
      <option value="Mami">Mami</option>
      <option value="Eduard">Eduard</option>
      <option value="Wilmer">Wilmer</option>
      <option value="Maite">Maite</option>
      <option value="Sophia">Sophia</option>
      <option value="Fernanda">Fernanda</option>
      <option value="Gaby">Gaby</option>
    </select>

    <label for="pin">Tu PIN personal</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="Ej. 1024" />

    <button type="button" onclick="verAsignacion()">Ver mi asignación</button>

    <div id="errorBox" class="error"></div>

    <div id="resultadoBox" class="resultado">
      <div>Te toca regalar a:</div>
      <div id="asignadoTexto" class="nombre-asignado"></div>
    </div>
  </div>

  <script>
    // Cambia estos PIN de 4 dígitos por los que tú quieras para cada persona
    const pines = {
      "Estefany": "1111",
      "Mami": "2222",
      "Eduard": "3333",
      "Wilmer": "4444",
      "Maite": "5555",
      "Sophia": "6666",
      "Fernanda": "7777",
      "Gaby": "8888"
    };

    // Ciclo cerrado: cada persona regala a la siguiente y nadie se saca a sí mismo
    const asignaciones = {
      "Estefany": "Mami",
      "Mami": "Eduard",
      "Eduard": "Wilmer",
      "Wilmer": "Maite",
      "Maite": "Sophia",
      "Sophia": "Fernanda",
      "Fernanda": "Gaby",
      "Gaby": "Estefany"
    };

    function verAsignacion() {
      const persona = document.getElementById("participante").value;
      const pinIngresado = document.getElementById("pin").value.trim();
      const errorBox = document.getElementById("errorBox");
      const resultadoBox = document.getElementById("resultadoBox");
      const asignadoTexto = document.getElementById("asignadoTexto");

      errorBox.style.display = "none";
      resultadoBox.style.display = "none";

      if (!persona) {
        errorBox.textContent = "Por favor, selecciona tu nombre.";
        errorBox.style.display = "block";
        return;
      }

      if (!pinIngresado || pines[persona] !== pinIngresado) {
        errorBox.textContent = "PIN incorrecto para " + persona + ".";
        errorBox.style.display = "block";
        return;
      }

      asignadoTexto.textContent = asignaciones[persona];
      resultadoBox.style.display = "block";
    }
  </script>
</body>
</html>
